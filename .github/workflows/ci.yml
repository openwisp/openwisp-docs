---
name: OpenWISP Docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: docs-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install test dependencies
        run: |
          sudo apt update
          sudo apt install libcairo2-dev poppler-utils
          pip install -U pip wheel setuptools
          pip install -U -r requirements.txt

      - name: Install npm dependencies
        run: sudo npm install -g prettier

      - name: Run tests
        run: ./runtests

      - name: QA checks, Build, Validate links (no 404s allowed), Check PDF
        run: PRODUCTION=1 ./run-qa-checks

      - name: Setup Google Cloud
        if: ${{ github.event_name == 'push' && github.repository == 'openwisp/openwisp-docs' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCS_DOWNLOADS_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.GCS_PROJECT_ID }}
          export_environment_variables: true

      - name: Set up Cloud SDK
        if: ${{ github.event_name == 'push' && github.repository == 'openwisp/openwisp-docs' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Deploy pages to openwisp.io/docs
        if: ${{ github.event_name == 'push' && github.repository == 'openwisp/openwisp-docs' }}
        run: |
          gcloud storage rsync --recursive "$SRC_URL" "$DST_URL"
        env:
          SRC_URL: /home/runner/work/openwisp-docs/openwisp-docs/_build/docs
          DST_URL: gs://${{ secrets.GCS_DOCS_BUCKET_NAME }}/docs

  invalidate-cache:
    name: Invalidate CDN cache
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.repository == 'openwisp/openwisp-docs' && needs.build.result == 'success' }}

    steps:
      - name: Authenticate to Google Cloud
        if: ${{ github.event_name == 'push' && github.repository == 'openwisp/openwisp-docs' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCS_DOWNLOADS_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.GCS_PROJECT_ID }}
          export_environment_variables: true

      - name: Invalid CDN cache on GCP
        if: ${{ github.event_name == 'push' && github.repository == 'openwisp/openwisp-docs' }}
        uses: stefanodotit/github-actions-invalidate-gcp-cdn@3c397edee5224cac3626b36b876b7a0a9464b9b4 # v1
        with:
          load_balancer_name: ${{ secrets.GCS_MAIN_LOAD_BALANCER_NAME }}
          host: openwisp.io
          path: "/docs/*"
